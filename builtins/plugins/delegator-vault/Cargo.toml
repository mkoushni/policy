# PPE delegation handler — HashiCorp Vault KV v2 secret retrieval.
#
# Resolves downstream credentials from Vault at delegation time, scoped to the
# caller's identity. PPE logs in to Vault with the caller's own JWT (Vault JWT
# auth, policy templated by the authenticated entity) so Vault enforces
# per-user isolation. Only the shared-credential case (`this_workload`)
# authenticates as PPE itself via AppRole.
#
# Scope: KV v2 reads only. Dynamic secrets (leased credentials) are a
# follow-up.

[package]
name = "praxis-policy-plugin-delegator-vault"
description = "PPE delegation handler — HashiCorp Vault KV v2 secret retrieval."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme.workspace = true

[dependencies]
praxis-policy-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }

zeroize = { workspace = true }
moka = { workspace = true }

[dev-dependencies]
praxis-policy-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
bytes = { workspace = true }

[lints]
workspace = true
